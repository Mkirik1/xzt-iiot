# trust_weights.yaml
# --------------------
# Weighted linear TrustScore formula. All weights configurable,
# never hardcoded in Python. The Blue Agent is allowed to adjust
# these (specifically w_anomaly and w_ml_risk) as one class of
# mitigation.
#
# ml_risk is the weight on the ACTUAL trained Track-1 XGBoost model's
# P(malicious) output (see ml_trust_bridge.py) -- this is the field
# that did not exist before the Track1/Track2 integration fix, when
# the self-hardening loop never consulted the trained model at all.

weights:
  identity_confidence: 0.25
  device_integrity: 0.20
  behavioral_trust: 0.20
  network_trust: 0.15
  authentication_strength: 0.20
  anomaly_risk: 0.35   # subtracted, not added -- see trust_engine.py
  ml_risk: 0.30        # subtracted, not added -- Track-1 model's P(malicious), see ml_trust_bridge.py
