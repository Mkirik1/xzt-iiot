# mosquitto-day1.conf -- simplest setup for the first bench session.
# Anyone on the network can publish anything, INCLUDING xzt/cmd/pump, so a
# device can bypass the gateway (attacker scenario D shows exactly that).
# Use only on the isolated testbed network (phone hotspot / lab router).
#   mosquitto -c mosquitto-day1.conf -v
listener 1883 0.0.0.0
allow_anonymous true
