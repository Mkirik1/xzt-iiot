# mosquitto-acl.conf -- the broker enforces who may publish where.
# Only the gateway may publish xzt/cmd/#, so scenario D is rejected, and a
# device may only publish under its own name, so impersonation is stopped
# at the broker before the gateway even sees it (defence in depth).
#
# One-time setup, in this folder:
#   mosquitto_passwd -c passwords.txt xzt-gateway
#   mosquitto_passwd    passwords.txt esp32_sensor
#   mosquitto_passwd    passwords.txt esp32_actuator
#   mosquitto_passwd    passwords.txt esp32_attacker
# Then run from this folder:
#   mosquitto -c mosquitto-acl.conf -v
# (If mosquitto cannot find the files, replace the two paths below with
# full paths, e.g. C:/Users/<you>/.../hardware/gateway/acl.txt)
listener 1883 0.0.0.0
allow_anonymous false
password_file passwords.txt
acl_file acl.txt
